<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=.5,maximum-scale=4,user-scalable=yes,viewport-fit=cover"><title>WRO Monitor</title><style>:root{color-scheme:dark;--bg:#0b0f14;--panel:#121821;--line:#263140;--txt:#eef5ff;--muted:#8fa0b4;--ok:#4ee59b;--warn:#ffd166;--bad:#ff6978;--brightblue:#4db8ff}*{box-sizing:border-box}html,body{min-height:100%;touch-action:pan-x pan-y pinch-zoom}body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:var(--bg);color:var(--txt);font:13px/1.3 sans-serif}main{padding:8px;min-width:100%}header{display:flex;justify-content:space-between;align-items:end;gap:8px;margin-bottom:8px}h1{font-size:18px;margin:0}.sub,#stamp{color:var(--muted);font-size:10px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.brightblue{color:var(--brightblue);font-weight:800;text-shadow:0 0 8px #4db8ff55}.cards{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:6px;margin-bottom:7px}.card,.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:8px}.card{padding:8px}.label{color:var(--muted);font-size:9px;text-transform:uppercase}.value{font-size:16px;font-weight:700}.tablewrap{overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:100vw;touch-action:pan-x pan-y pinch-zoom}table{min-width:1500px;width:max-content;border-collapse:collapse;white-space:nowrap}th,td{padding:6px;border-bottom:1px solid #1e2835;text-align:left}th{font-size:9px;color:var(--muted);text-transform:uppercase;position:sticky;top:0;background:#0f151d;z-index:2}.num{text-align:right}.acct{font-weight:700;position:sticky;left:0;background:var(--panel);z-index:1}.pill{display:inline-block;padding:2px 5px;border:1px solid var(--line);border-radius:999px;font-size:9px}.online{color:var(--ok);border-color:#286b52}.offline{color:var(--bad);border-color:#803844}.block{max-width:150px;overflow:hidden;text-overflow:ellipsis}.bestcell{min-width:230px;font-weight:600}.smallbtn,#savePair{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#182230;color:var(--txt)}#setup{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));z-index:10}#setup.show{display:flex}.dialog{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.dialog input{width:100%;padding:10px;background:#0b1016;color:var(--txt);border:1px solid var(--line);border-radius:7px;margin:8px 0}@media(orientation:landscape){.cards{grid-template-columns:repeat(4,minmax(120px,1fr))}table{min-width:1400px}}@media(max-width:420px){body{font-size:12px}.cards{grid-template-columns:repeat(2,minmax(110px,1fr))}.value{font-size:14px}th,td{padding:5px}}</style></head><body><main><header><div><h1>WRO Fleet Monitor</h1><div id="stamp">Loading…</div></div><div><span id="source" class="pill">SOURCE</span> <button id="changePair" class="smallbtn">Pair</button></div></header><section class="cards" id="cards"></section><div class="tablewrap"><table><thead><tr><th>Account</th><th>EA</th><th>Status</th><th class="num">Balance</th><th class="num">Equity</th><th class="num">Profit</th><th class="num">Active Order</th><th class="num">Pending Order</th><th>Best Symbol</th><th>Worst Symbol</th><th class="num">CPU</th><th class="num">RAM</th><th class="num">Starve</th><th>Latest Blocker</th><th class="num">Proof</th><th class="num">Broker</th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="setup"><div class="dialog"><h2>Pair WRO Monitor</h2><div class="sub">Masukkan pairing code sekali. Code disimpan hanya di HP ini.</div><input id="pairInput" type="password" autocomplete="off" placeholder="Pairing code"><button id="savePair">Save & Connect</button></div></div><script src="app.js"></script></body></html>
