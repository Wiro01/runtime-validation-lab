name: WRO Monitor Android APK
on:
  push:
    branches: [wro-monitor-android-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.9/bin' >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle -p wro-monitor-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WRO-Monitor-Android
          path: wro-monitor-android/app/build/outputs/apk/debug/app-debug.apk
